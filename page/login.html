<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <title>Login Page</title>
  </head>
 <body class="login-page">
  <main class="login-container">
 <div class="bulat-berputar login-rings" aria-hidden="true"></div>

    <section class="card-login">
      <form class="login-form" action="#" method="post">
        <header class="header-login">
          <div class="login-brand">
            <img src="/assets/logo.svg" alt="" />
            <span>
              <strong>Firman</strong>
              <small>Fish Canning Resource Management</small>
            </span>
          </div>

          <h1>Selamat Datang!</h1>
          <p>Masuk Terlebih Dahulu Untuk Melanjutkan</p>
        </header>

        <div class="login-field">
          <label for="username">Masukkan Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
          />
        </div>

        <div class="login-field">
          <label for="password">Masukkan Password</label>
          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              class="password-toggle"
              type="button"
              aria-label="Tampilkan password"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button class="login-submit" type="submit">
          <span class="login-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </span>
          Masuk ke Dashboard
        </button>
      </form>
    </section>
  </main>

  <script>
    const password = document.querySelector("#password");
    const toggle = document.querySelector(".password-toggle");

    toggle.addEventListener("click", () => {
      const showPassword = password.type === "password";
      password.type = showPassword ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(showPassword));
      toggle.setAttribute(
        "aria-label",
        showPassword ? "Sembunyikan password" : "Tampilkan password",
      );
    });
  </script>
</body>
</html>
