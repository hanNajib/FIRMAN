<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <title>Login Page</title>
  </head>
 <body class="login-page">
  <main class="login-container">
 <div class="bulat-berputar login-rings" aria-hidden="true"></div>

    <section class="card-login">
      <form class="login-form" id="loginForm">
        <header class="header-login">
          <div class="login-brand">
            <img src="/assets/logo.svg" alt="" />
            <span>
              <strong>Firman</strong>
              <small>Fish Canning Resource Management</small>
            </span>
          </div>

          <h1>Selamat Datang!</h1>
          <p>Masuk Terlebih Dahulu Untuk Melanjutkan</p>
        </header>

        <div class="login-field">
          <label for="username">Masukkan Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
          />
        </div>

        <div class="login-field">
          <label for="password">Masukkan Password</label>
          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              class="password-toggle"
              type="button"
              aria-label="Tampilkan password"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <a
          id="loginDashboardLink"
          class="btn-slider login-submit"
          href="/page/admin/index.html"
        >
          <span class="circle login-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </span>
          <span class="btn-slider-text">Masuk</span>
        </a>
      </form>
    </section>
  </main>

  <script>
    const password = document.querySelector("#password");
    const toggle = document.querySelector(".password-toggle");

    toggle.addEventListener("click", () => {
      const showPassword = password.type === "password";
      password.type = showPassword ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(showPassword));
      toggle.setAttribute(
        "aria-label",
        showPassword ? "Sembunyikan password" : "Tampilkan password",
      );
    });

    const loginForm = document.querySelector("#loginForm");
    const username = document.querySelector("#username");
    const dashboardLink = document.querySelector("#loginDashboardLink");
    const loginArrow = dashboardLink.querySelector(".circle");
    const slideDistance =
      dashboardLink.clientWidth -
      loginArrow.offsetWidth -
      parseFloat(getComputedStyle(dashboardLink).paddingLeft) -
      parseFloat(getComputedStyle(dashboardLink).paddingRight);

    dashboardLink.style.setProperty("--slide-distance", `${slideDistance}px`);
    username.addEventListener("input", () => {
      username.setCustomValidity("");
    });

    dashboardLink.addEventListener("click", (event) => {
      event.preventDefault();

      if (dashboardLink.classList.contains("active")) return;

      username.setCustomValidity(
        username.value.trim() ? "" : "Masukkan username terlebih dahulu.",
      );

      if (!loginForm.reportValidity()) return;

      dashboardLink.classList.add("active");
      window.setTimeout(
        () => window.location.assign(dashboardLink.href),
        window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450,
      );
    });
  </script>
</body>
</html>
