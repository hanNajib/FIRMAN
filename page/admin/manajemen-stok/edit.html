<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form bahan baku – Firman</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="../../../style.css">
</head>

<body data-view="form" data-mod="stok">
    <div class="app">

        <aside class="side">
            <div class="logo">
                <div class="logo-mark">
                    <img src="../../../assets/logo.svg" alt="Logo Firman">
                </div>
                <div>
                    <b>Firman</b><small>Fish canning resources management</small>
                </div>
            </div>
            <nav class="menu" aria-label="Menu utama">
                <span class="menu-label">Menu utama</span>
                <a href="../index.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="9" rx="1" />
                        <rect x="14" y="3" width="7" height="5" rx="1" />
                        <rect x="14" y="12" width="7" height="9" rx="1" />
                        <rect x="3" y="16" width="7" height="5" rx="1" />
                    </svg>
                    Dashboard
                </a>
                <a href="../manajemen-pesanan/dashboard.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0" />
                    </svg>
                    Manajemen Pesanan
                </a>
                <a href="dashboard.html" class="active" aria-current="page">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8" />
                    </svg>
                    Manajemen Stok Bahan Baku
                </a>
                <a href="../manajemen-produksi/dashboard.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 20V9l6 4V9l6 4V4h4v16zM2 20h20" />
                    </svg>
                    Manajemen Produksi
                </a>
            </nav>
            <div class="user">
                <div class="avatar">A</div>
                <div>
                    <b>Admin Firman</b>
                    <small>Administrator</small>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="head">
                <div class="titlebar">
                    <a class="icon-btn" href="dashboard.html" aria-label="Kembali ke daftar">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                    </a>
                    <div>
                        <div class="bc">
                            <a href="dashboard.html">Manajemen Stok Bahan Baku</a> › <b id="fcrumb">Form</b>
                        </div>
                        <h1>Ubah bahan baku</h1>
                        <p>Perbarui data di bawah, lalu simpan.</p>
                    </div>
                </div>
            </header>

            <section class="fc">
                <form class="fc" id="form" action="dashboard.html" method="get">
                    <div class="fg">
                        <div>
                            <label for="f-kode">Kode</label>
                            <input id="f-kode" name="kode" type="text" required>
                        </div>
                        <div>
                            <label for="f-nama">Nama bahan</label>
                            <input id="f-nama" name="nama" type="text" required>
                        </div>
                        <div>
                            <label for="f-kat">Kategori</label>
                            <select id="f-kat" name="kat" required>
                                <option value="" selected disabled>Pilih kategori</option>
                                <option>Ikan</option>
                                <option>Kemasan</option>
                                <option>Bahan tambahan</option>
                            </select>
                        </div>
                        <div>
                            <label for="f-stok">Stok</label>
                            <input id="f-stok" name="stok" type="number" min="0" required>
                        </div>
                        <div>
                            <label for="f-sat">Satuan</label>
                            <select id="f-sat" name="sat" required>
                                <option value="" selected disabled>Pilih satuan</option>
                                <option>kg</option>
                                <option>pcs</option>
                                <option>lembar</option>
                                <option>liter</option>
                            </select>
                        </div>
                        <div>
                            <label for="f-min">Stok minimum</label>
                            <input id="f-min" name="min" type="number" min="0" required>
                        </div>
                        <div>
                            <label for="f-harga">Harga per satuan (Rp)</label>
                            <input id="f-harga" name="harga" type="number" min="0" required>
                        </div>
                        <div>
                            <label for="f-sup">Supplier</label>
                            <input id="f-sup" name="sup" type="text" required>
                        </div>
                    </div>
                    <div class="fa">
                        <a class="btn ghost" href="dashboard.html">Batal</a>
                        <button type="submit" class="btn">Simpan</button>
                    </div>
                </form>
            </section>
        </main>

    </div>
    <div class="toast" id="toast" role="status"></div>

    <script src="../../../js/store.js"></script>
    <script>
        Firman.initForm({ collection: 'stok', mode: 'edit' });
    </script>
</body>

</html>
