<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Form bahan baku – Firman</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
        <link rel="stylesheet" href="../../../style.css">
        <style>
            :root {
                --p:#D33131;
                --pd:#B22626;
                --a:#FFEA2E;
                --bg:#F6F6F6;
                --tx:#1d1d21;
                --m:#6a6a74;
                --bd:#e7e7eb
            }

            * {
                box-sizing:border-box;
                margin:0
            }

            body {
                background:var(--bg);
                color:var(--tx);
                font:14px/1.5 'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif
            }

            /* ---- CRUD, form,---- */
            .btn {
                border:1px solid var(--p)
            }

            .btn:hover {
                border-color:var(--pd)
            }

            button.btn {
                cursor:pointer;
                font:inherit;
                font-weight:700
            }

            .btn.ghost {
                background:#fafafa;
                color:var(--tx);
                border-color:var(--bd)
            }

            .btn.ghost:hover {
                background:#f0f0f0;
                border-color:var(--bd)
            }

            .icon-btn {
                display:inline-grid;
                place-items:center;
                width:34px;height:34px;
                border:1px solid var(--bd);
                border-radius:9px;
                background:#fff;
                color:var(--m);
                cursor:pointer;
                text-decoration:none
            }

            .icon-btn:hover {
                color:var(--p);
                border-color:var(--p)
            }

            .empty {
                text-align:center;
                color:var(--m);
                padding:40px
            }

            .titlebar {
                display:flex;
                gap:14px;
                align-items:flex-start
            }

            .bc {
                font-size:13px;
                color:var(--m);
                margin-bottom:6px
            }

            .bc a {
                color:var(--m);
                text-decoration:none
            }

            .bc a:hover {
                color:var(--p)
            }

            .bc b {
                color:var(--tx);
                font-weight:600
            }

            .fc {
                background:#fff;
                border:1px solid var(--bd);
                border-radius:14px;
                padding:26px;
                max-width:880px
            }

            .fg {
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px
            }

            label {
                display:block;
                font-size:12.5px;
                font-weight:700;
                color:var(--m)
            }

            .fg input,.fg select {
                width:100%;
                flex:none;
                min-width:0;
                max-width:none;
                margin-top:5px
            }

            .fa {
                display:flex;
                justify-content:flex-end;
                align-items:center;
                gap:10px;
                margin-top:22px;
                padding-top:20px;
                border-top:1px solid var(--bd)
            }

        </style>
    </head>
    <body data-view="form" data-mod="stok">
        <div class="app">

            <aside class="side">
                <div class="logo">
                    <div class="logo-mark">
                        <svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true">
                            <ellipse cx="11" cy="13" rx="8" ry="5.5" fill="#FFEA2E"/>
                            <path d="M17 13l7-6v12z" fill="#FFEA2E"/>
                            <circle cx="7.5" cy="11.5" r="1.2" fill="#D33131"/>
                        </svg>
                    </div>
                    <div>
                        <b>Firman</b><small>Fish canning resources management</small>
                    </div>
                </div>
                <nav class="menu" aria-label="Menu utama">
                    <a href="../">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
                            <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
                        </svg>
                        Dashboard
                    </a>
                    <a href="dashboard.html" class="active" aria-current="page">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>
                        </svg>
                        Manajemen Pesanan
                    </a>
                    <a href="../manajemen-stok/dashboard.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>
                        Manajemen Stok Bahan Baku
                    </a>
                    <a href="../manajemen-produksi/dashboard.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20V9l6 4V9l6 4V4h4v16zM2 20h20"/></svg>
                        Manajemen Produksi
                    </a>
                </nav>
                <div class="user">
                    <div class="avatar">A</div>
                    <div>
                        <b>Admin Firman</b>
                        <small>Administrator</small>
                    </div>
                </div>
            </aside>

            <main class="main">
                <header class="head">
                    <div class="titlebar">
                        <a class="icon-btn" href="dashboard.html" aria-label="Kembali ke daftar">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m15 18-6-6 6-6"/>
                            </svg>
                        </a>
                        <div>
                            <div class="bc">
                                <a href="dashboard.html">Manajemen Pesanan</a> › <b id="fcrumb">Form</b>
                            </div>
                            <h1>Ubah pesanan</h1>
                            <p>Perbarui data di bawah, lalu simpan.</p>
                        </div>
                    </div>
                </header>

                <section class="fc">
                    <form class="fc" action="create.html" method="get">
                        <div class="fg">
                            <div>
                                <label for="f-kode">No. pesanan</label>
                                <input id="f-kode" name="kode" type="text">
                            </div>
                            <div>
                                <label for="f-pelanggan">Pelanggan</label>
                                <input id="f-pelanggan" name="pelanggan" type="text">
                            </div>
                            <div>
                                <label for="f-produk">Produk</label>
                                <select id="f-produk" name="produk">
                                    <option value="" selected disabled>Pilih produk</option>
                                    <option>Sarden Saus Tomat 155 g</option>
                                    <option>Tuna dalam Minyak 170 g</option>
                                    <option>Makarel Saus Cabai 425 g</option>
                                </select>
                            </div>
                            <div>
                                <label for="f-qty">Jumlah (karton)</label>
                                <input id="f-qty" name="qty" type="number" min="0">
                            </div>
                            <div>
                                <label for="f-total">Total (Rp)</label>
                                <input id="f-total" name="total" type="number" min="0">
                            </div>
                            <div>
                                <label for="f-tgl">Tanggal</label>
                                <input id="f-tgl" name="tgl" type="date">
                            </div>
                            <div>
                                <label for="f-status">Status</label>
                                <select id="f-status" name="status">
                                    <option value="" selected disabled>Pilih status</option>
                                    <option>Baru</option>
                                    <option>Diproses</option>
                                    <option>Dikirim</option>
                                    <option>Selesai</option>
                                    <option>Dibatalkan</option>
                                </select>
                            </div>
                        </div>
                        <div class="fa">
                            <a class="btn ghost" href="dashboard.html">Batal</a>
                            <button type="submit" class="btn">Simpan</button>
                        </div>
                    </form>
                </section>
            </main>

        </div>
        <div class="toast" id="toast" role="status"></div>
    </body>
</html>
