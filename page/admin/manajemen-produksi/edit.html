<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Form bahan baku – Firman</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
        <link rel="stylesheet" href="../../../style.css">
    </head>
    <body data-view="form" data-mod="stok">
        <div class="app">

            <aside class="side">
                <div class="logo">
                    <div class="logo-mark">
                        <img src="../../../assets/logo.svg" alt="Logo Firman">
                    </div>
                    <div>
                        <b>Firman</b><small>Fish canning resources management</small>
                    </div>
                </div>
                <nav class="menu" aria-label="Menu utama">
                    <span class="menu-label">Menu utama</span>
                    <a href="../">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
                            <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
                        </svg>
                        Dashboard
                    </a>
                    <a href="../manajemen-pesanan/dashboard.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>
                        </svg>
                        Manajemen Pesanan
                    </a>
                    <a href="../manajemen-stok/dashboard.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>
                        Manajemen Stok Bahan Baku
                    </a>
                    <a href="dashboard.html" class="active" aria-current="page">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20V9l6 4V9l6 4V4h4v16zM2 20h20"/></svg>
                        Manajemen Produksi
                    </a>
                </nav>
                <div class="user">
                    <div class="avatar">A</div>
                    <div>
                        <b>Admin Firman</b>
                        <small>Administrator</small>
                    </div>
                </div>
            </aside>

            <main class="main">
                <header class="head">
                    <div class="titlebar">
                        <a class="icon-btn" href="dashboard.html" aria-label="Kembali ke daftar">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m15 18-6-6 6-6"/>
                            </svg>
                        </a>
                        <div>
                            <div class="bc">
                                <a href="dashboard.html">Manajemen Produksi</a> › <b id="fcrumb">Form</b>
                            </div>
                            <h1>Ubah batch produksi</h1>
                            <p>Perbarui data di bawah, lalu simpan.</p>
                        </div>
                    </div>
                </header>

                <section class="fc">
                    <form class="fc" action="create.html" method="get">
                        <div class="fg">
                            <div>
                                <label for="f-kode">Kode batch</label>
                                <input id="f-kode" name="kode" type="text">
                            </div>
                            <div>
                                <label for="f-produk">Produk</label>
                                <select id="f-produk" name="produk">
                                    <option value="" selected disabled>Pilih produk</option>
                                    <option>Sarden Saus Tomat 155 g</option>
                                    <option>Tuna dalam Minyak 170 g</option>
                                    <option>Makarel Saus Cabai 425 g</option>
                                </select>
                            </div>
                            <div>
                                <label for="f-target">Target (kaleng)</label>
                                <input id="f-target" name="target" type="number" min="0">
                            </div>
                            <div>
                                <label for="f-hasil">Hasil (kaleng)</label>
                                <input id="f-hasil" name="hasil" type="number" min="0">
                            </div>
                            <div>
                                <label for="f-tgl">Tanggal</label>
                                <input id="f-tgl" name="tgl" type="date">
                            </div>
                            <div>
                                <label for="f-pj">Penanggung jawab</label>
                                <input id="f-pj" name="pj" type="text">
                            </div>
                            <div>
                                <label for="f-status">Status</label>
                                <select id="f-status" name="status">
                                    <option value="" selected disabled>Pilih status</option>
                                    <option>Direncanakan</option>
                                    <option>Berjalan</option>
                                    <option>Selesai</option>
                                    <option>Tertunda</option>
                                </select>
                            </div>
                        </div>
                        <div class="fa">
                            <a class="btn ghost" href="dashboard.html">Batal</a>
                            <button type="submit" class="btn">Simpan</button>
                        </div>
                    </form>
                </section>
            </main>

        </div>
        <div class="toast" id="toast" role="status"></div>
    </body>
</html>
